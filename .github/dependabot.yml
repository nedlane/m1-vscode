version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # @types/vscode must stay <= engines.vscode (the minimum VS Code API the
      # extension declares it supports). Dependabot floats it to latest, which
      # makes `vsce package` refuse the build. Only bump it deliberately when we
      # raise engines.vscode. See closed PR #134.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
