name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: every job only reads the repo (and downloads public
# release assets). Jobs opt into more only if they need it.
permissions:
  contents: read

# Cancel superseded runs of the same branch/PR: every push otherwise queues
# a full duplicate job matrix (m1-tools#27).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-server-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Verify pinned m1-lsp release ships server binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run server:verify

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run compile

      - name: Grammar tokenization tests
        run: npm run test:grammar

      - name: Bundle
        run: npm run build

      # Run the VS Code Extension Host suite headless (xvfb provides a display on
      # the Linux runner; @vscode/test-electron downloads a real VS Code). The
      # suite exercises real LSP hover/definition, so the server binary must be
      # present first. (#18)
      - name: Fetch m1-lsp server (for the integration tests)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run server:fetch

      - name: Fetch m1-project (for the editing-command integration test)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run project:fetch

      - name: Scaffold-config test
        run: npm run test:scaffold

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Integration tests (multi-root workspace)
        run: xvfb-run -a npm run test:integration:multiroot

      - name: Package VSIX
        run: npx vsce package --no-dependencies -o m1-vscode.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: m1-vscode-vsix
          path: m1-vscode.vsix
