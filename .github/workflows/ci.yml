name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Grammar tokenization tests
        run: npm run test:grammar

      - name: Bundle
        run: npm run build

      - name: Package VSIX
        run: npx vsce package --no-dependencies -o m1-vscode.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: m1-vscode-vsix
          path: m1-vscode.vsix
