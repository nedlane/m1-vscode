name: Sync m1-lsp server

# Watches the m1-lsp repo for a newer server release. When found, opens a PR
# that repins package.json m1.serverVersion and bumps the extension version.
# A human reviews + merges; tag-on-version-bump.yml then tags the merge commit,
# which triggers release.yml to rebuild and publish every per-platform VSIX.
#
# NOTE: this used to commit + tag and push straight to `main`. `main` is a
# protected branch ("changes must be made through a pull request"), so that
# direct push was always rejected and the daily sync failed silently. Hence the
# PR-based flow below — the repin lands as a reviewable PR, never a direct push.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Open the PR even if the server version is unchanged"
        type: boolean
        default: false

# Least-privilege default. The branch push / PR is done with the GH_PAT (see the
# checkout step), so the workflow does not rely on GITHUB_TOKEN write scopes.
permissions:
  contents: read

# Serialize release runs — never cancel one mid-publish; a queued run is
# idempotent for an already-released version (m1-tools#27).
concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # PAT so the branch push / PR is attributed to a real account and can
          # trigger PR checks (GITHUB_TOKEN pushes do not trigger other workflows).
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Resolve versions
        id: v
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          REPO=$(node -p "require('./package.json').m1.serverRepo")
          PINNED=$(node -p "require('./package.json').m1.serverVersion")
          LATEST=$(gh release view --repo "$REPO" --json tagName -q .tagName)
          # SECURITY: the upstream tag name is attacker-influenced (anyone who can
          # cut a release/tag on the m1-lsp repo controls it). It is later spliced
          # into a branch name, commit message and a node script, so reject anything
          # that is not a strict vX.Y.Z semver tag before it can reach a shell/JS
          # context. This blocks tag-name script injection (e.g. v9$(...), v0'+...).
          if ! printf '%s' "$LATEST" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to use untrusted m1-lsp tag name '$LATEST' — expected vX.Y.Z." >&2
            exit 1
          fi
          echo "repo=$REPO"     >> "$GITHUB_OUTPUT"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "m1-lsp pinned=$PINNED latest=$LATEST"

      - name: Open repin PR
        if: steps.v.outputs.latest != steps.v.outputs.pinned || inputs.force
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # SECURITY: pass the (already vX.Y.Z-validated) tag through the env, never
          # via ${{ }} template interpolation into the run: script or the node -e
          # string. Interpolation would splice the raw tag into shell/JS text before
          # execution; reading it from $LATEST / process.env.LATEST keeps it as data.
          LATEST: ${{ steps.v.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="sync/server-$LATEST"
          # Read the version from the environment (process.env.LATEST), not by
          # concatenating it into the JS source.
          node -e "const f='package.json';const p=require('./'+f);p.m1.serverVersion=process.env.LATEST;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          NEWVER=$(npm version patch --no-git-tag-version | tr -d 'v')
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore: bump m1-lsp server to $LATEST, release v$NEWVER"
          # Force-update the branch so a re-run after an earlier failed sync
          # refreshes it rather than erroring on a stale ref.
          git push -f origin "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $BRANCH — branch updated."
          else
            BODY="Automated by sync-server.yml. Repins the bundled m1-lsp server to **$LATEST** and bumps the extension to **v$NEWVER**. Review + merge — tag-on-version-bump.yml will tag the merge commit and release.yml will build + publish the per-platform VSIXes. Nothing auto-merges."
            gh pr create --base main --head "$BRANCH" \
              --title "chore: bump m1-lsp server to $LATEST (v$NEWVER)" \
              --body "$BODY"
          fi

      # Pin-freshness signal (#105): a sync PR that sits unmerged keeps the
      # extension bundling an older server with nothing escalating. When the
      # pin is behind and the open sync PR is older than 3 days (or the PR is
      # missing entirely on a behind pin), open/refresh one tracking issue —
      # an issue rather than a failing badge, since the trigger is external.
      - name: Escalate a stale sync PR
        if: steps.v.outputs.latest != steps.v.outputs.pinned
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PINNED: ${{ steps.v.outputs.pinned }}
          LATEST: ${{ steps.v.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="sync/server-$LATEST"
          created=$(gh pr view "$BRANCH" --json state,createdAt \
            -q 'select(.state == "OPEN") | .createdAt' 2>/dev/null || true)
          if [ -n "$created" ]; then
            age_days=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 86400 ))
            echo "sync PR for $LATEST open for ${age_days}d"
            [ "$age_days" -lt 3 ] && exit 0
          else
            echo "pin behind ($PINNED < $LATEST) with no open sync PR"
          fi
          title="stale server pin: extension still bundles m1-lsp $PINNED"
          body="The bundled server pin is **$PINNED** but the latest m1-lsp release is **$LATEST**. The sync PR (branch \`sync/server-$LATEST\`) is either missing or has been open for 3+ days — merge it (or fix what blocks it) so releases stop shipping the older server. _Refreshed automatically by sync-server.yml._"
          existing=$(gh issue list --state open --search "in:title \"stale server pin\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
