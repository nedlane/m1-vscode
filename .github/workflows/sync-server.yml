name: Sync bundled M1 toolchain

# Propose one reviewed release PR for every bundled tool, including formatter,
# linter and project updates that do not change m1-lsp. Never auto-merge.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Open the PR even if the tool versions are unchanged"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-bundled-toolchain
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require PR automation token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Set GH_PAT with repository contents and pull-request write access; PAT-created PRs trigger CI."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Resolve complete published releases and repin
        id: pins
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          node scripts/sync-tool-pins.mjs --write > "$RUNNER_TEMP/tool-pins.json"
          cat "$RUNNER_TEMP/tool-pins.json"
          echo "changed=$(jq -r .changed "$RUNNER_TEMP/tool-pins.json")" >> "$GITHUB_OUTPUT"
      - name: Open reviewed toolchain repin PR
        if: steps.pins.outputs.changed == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          BRANCH="sync/bundled-toolchain"
          NEWVER=$(npm version patch --no-git-tag-version | tr -d 'v')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore: refresh bundled M1 toolchain, release v$NEWVER"
          # Preserve reviews when today's proposal has exactly the same files.
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            if git diff --quiet FETCH_HEAD HEAD -- package.json package-lock.json; then
              echo "Existing proposal already contains these pins; preserve its reviews."
            else
              git push --force-with-lease origin "$BRANCH"
            fi
          else
            git push origin "$BRANCH"
          fi
          {
            echo "Refresh bundled M1 tools to complete stable releases, each with all three platform assets and matching SHA256SUMS."
            echo ""
            echo "| Tool | Previous | Proposed |"
            echo "| --- | --- | --- |"
            jq -r '.pins[] | "| \(.tool) | \(.previous) | \(.latest) |"' "$RUNNER_TEMP/tool-pins.json"
            echo ""
            echo "Review and merge after CI passes. The extension version is v$NEWVER. Existing tag and release workflows publish the platform VSIXes. Nothing auto-merges."
          } > "$RUNNER_TEMP/tool-pins-pr.md"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "chore: refresh bundled M1 toolchain (v$NEWVER)" --body-file "$RUNNER_TEMP/tool-pins-pr.md"
          else
            gh pr create --base main --head "$BRANCH" --title "chore: refresh bundled M1 toolchain (v$NEWVER)" --body-file "$RUNNER_TEMP/tool-pins-pr.md"
          fi
      - name: Escalate stale toolchain proposal
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          created=$(gh pr view sync/bundled-toolchain --json state,createdAt -q 'select(.state == "OPEN") | .createdAt')
          age_days=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 86400 ))
          [ "$age_days" -lt 3 ] && exit 0
          title="stale bundled toolchain: repin proposal needs review"
          existing=$(gh issue list --state open --search 'in:title "stale bundled toolchain"' --json number --jq '.[0].number // empty')
          body="The bundled-toolchain repin PR has waited 3+ days. Review its CI and merge so extension updates include the latest complete tool releases."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
