name: Release

# Builds one VSIX per platform, each with the matching m1-lsp server binary
# (pinned via package.json m1.serverVersion) bundled in, and publishes them to a
# GitHub Release. Triggered by a version tag (pushed by sync-server.yml) or
# manually.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Serialize release runs — never cancel one mid-publish; a queued run is
# idempotent for an already-released version (m1-tools#27).
concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Intel macOS (darwin-x64) is intentionally omitted — m1-lsp does not
        # publish Intel-Mac server binaries (no CI runner). Intel-Mac users
        # install the server-less "universal" VSIX below and build the server
        # themselves; see README ("Intel macOS").
        include:
          - vscodeTarget: linux-x64
            rustTarget: x86_64-unknown-linux-gnu
          - vscodeTarget: darwin-arm64
            rustTarget: aarch64-apple-darwin
          - vscodeTarget: win32-x64
            rustTarget: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Fetch m1-lsp server for ${{ matrix.rustTarget }}
        env:
          # PAT with read access to the (private) m1-lsp repo.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node scripts/fetch-server.mjs --target ${{ matrix.rustTarget }}

      - name: Fetch m1-project for ${{ matrix.rustTarget }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node scripts/fetch-project.mjs --target ${{ matrix.rustTarget }}

      - name: Fetch m1-lint for ${{ matrix.rustTarget }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node scripts/fetch-lint.mjs --target ${{ matrix.rustTarget }}

      - name: Fetch m1-fmt for ${{ matrix.rustTarget }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node scripts/fetch-fmt.mjs --target ${{ matrix.rustTarget }}

      - name: Bundle extension
        run: npm run build

      - name: Package ${{ matrix.vscodeTarget }} VSIX
        run: >-
          npx vsce package --no-dependencies
          --target ${{ matrix.vscodeTarget }}
          -o m1-vscode-${{ matrix.vscodeTarget }}.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.vscodeTarget }}
          path: m1-vscode-${{ matrix.vscodeTarget }}.vsix

  # A target-less VSIX with NO server bundled. Installs on any platform
  # (incl. Intel macOS, linux-arm64); the user supplies a server via
  # m1.server.path or PATH.
  package-universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Bundle extension
        run: npm run build
      - name: Package universal (server-less) VSIX
        run: npx vsce package --no-dependencies -o m1-vscode-universal.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-universal
          path: m1-vscode-universal.vsix

  release:
    needs: [package, package-universal]
    runs-on: ubuntu-latest
    steps:
      # Checkout is needed to read the bundled-tool pins out of package.json
      # for the release notes.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist-vsix
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="manual-$(date +%Y%m%d-%H%M%S)"
          fi

          # Body: auto-generated "What's Changed" (PR list + full changelog
          # link) followed by install docs and the bundled tool versions. PR
          # titles may contain backticks, so the generated half never passes
          # through an unquoted heredoc; the static half is a quoted heredoc.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            -q .body > body.md || echo "_Generated notes unavailable._" > body.md
          cat >> body.md <<'NOTES'

          ## Install

          Download the VSIX for your platform and install it (or use VS Code's "Extensions: Install from VSIX…" command):

          ```sh
          code --install-extension m1-vscode-<platform>.vsix
          ```

          | Platform | Asset |
          | --- | --- |
          | Linux x86_64 | `m1-vscode-linux-x64.vsix` |
          | macOS Apple Silicon | `m1-vscode-darwin-arm64.vsix` |
          | Windows x86_64 | `m1-vscode-win32-x64.vsix` |
          | Anything else (Intel macOS, linux-arm64, …) | `m1-vscode-universal.vsix` |

          The platform VSIXes bundle the matching m1-lsp server, m1-project, m1-lint and m1-fmt CLIs. The universal VSIX bundles no binaries — point `m1.server.path` / `m1.lint.path` / `m1.fmt.path` at your own builds (see README).
          NOTES
          {
            echo ""
            echo "## Bundled tools (platform VSIXes)"
            echo ""
            echo "| Tool | Version |"
            echo "| --- | --- |"
            echo "| m1-lsp | $(grep -o '"serverVersion": "[^"]*"' package.json | cut -d'"' -f4) |"
            echo "| m1-project | $(grep -o '"projectVersion": "[^"]*"' package.json | cut -d'"' -f4) |"
            echo "| m1-lint | $(grep -o '"lintVersion": "[^"]*"' package.json | cut -d'"' -f4) |"
            echo "| m1-fmt | $(grep -o '"fmtVersion": "[^"]*"' package.json | cut -d'"' -f4) |"
          } >> body.md

          gh release create "$TAG" dist-vsix/*.vsix \
            --repo "${{ github.repository }}" \
            --title "m1-vscode $TAG" \
            --notes-file body.md \
            || gh release upload "$TAG" dist-vsix/*.vsix --repo "${{ github.repository }}" --clobber

  # Publish the built VSIXes to the Open VSX Registry (open-vsx.org) — the
  # registry used by VSCodium, Cursor, Windsurf, Gitpod, and other non-Marketplace
  # editors. Runs only after the GitHub Release succeeds and reuses the same
  # artifacts, so the two channels always ship identical bytes.
  #
  # Gated on the OPEN_VSX_TOKEN secret: when it is absent (forks, or before the
  # maintainer opts in) the job no-ops with a notice instead of failing the
  # release. To enable, create an Open VSX access token for the `m1-tooling`
  # namespace (https://open-vsx.org/user-settings/tokens) and add it as the repo
  # secret OPEN_VSX_TOKEN.
  publish-openvsx:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: dist-vsix
          merge-multiple: true
      - name: Publish to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          if [ -z "$OVSX_TOKEN" ]; then
            echo "::notice::OPEN_VSX_TOKEN not set — skipping Open VSX publish."
            exit 0
          fi
          # First publish only: create the namespace. Idempotent — ignore the
          # "namespace already exists" error on subsequent releases.
          npx ovsx create-namespace m1-tooling -p "$OVSX_TOKEN" || true
          # Publish every built VSIX (the three platform targets + the universal
          # server-less fallback). ovsx reads each VSIX's target from its manifest.
          shopt -s nullglob
          published=0
          for vsix in dist-vsix/*.vsix; do
            echo "Publishing $vsix to Open VSX…"
            npx ovsx publish "$vsix" -p "$OVSX_TOKEN"
            published=$((published + 1))
          done
          if [ "$published" -eq 0 ]; then
            echo "::error::No VSIX artifacts found to publish."
            exit 1
          fi
